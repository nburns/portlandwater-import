name: Portland Water Import
version: "0.1.3"
slug: portlandwater_import
description: Pull Portland Water Bureau quarterly water usage + billed cost into Home Assistant long-term statistics.
url: https://github.com/nburns/portlandwater-import
arch:
  - amd64
  - aarch64
startup: application
boot: auto
stage: experimental
init: false
# --- security lockdown ---
# The add-on only needs to reach HA Core's WebSocket via the supervisor
# proxy. That requires `homeassistant_api` (which populates SUPERVISOR_TOKEN).
# hassio_api / auth_api / docker_api are all left off deliberately.
homeassistant_api: true
hassio_api: false
auth_api: false
docker_api: false
host_network: false
host_pid: false
host_ipc: false
host_dbus: false
privileged: []      # no capabilities
devices: []         # no host device access
usb: false
uart: false
kernel_modules: false
full_access: false
apparmor: true      # loads apparmor.txt
ingress: false
panel_icon: mdi:water
options:
  username: ""
  password: ""
  account_no: ""
  statistic_id: "portlandwater:water_consumption"
  statistic_name: "Portland Water consumption"
  cost_statistic_id: "portlandwater:water_cost"
  cost_statistic_name: "Portland Water cost"
  schedule: "17 6 * * 0"    # every Sunday at 06:17 local (PWB bills quarterly)
  run_backfill_on_start: true
schema:
  username: str
  password: password
  account_no: str?
  statistic_id: str
  statistic_name: str
  cost_statistic_id: str
  cost_statistic_name: str
  schedule: str
  run_backfill_on_start: bool
