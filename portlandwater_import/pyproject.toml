[project]
name = "portlandwater-import"
version = "0.1.0"
description = "Pull Portland Water Green Button data into Home Assistant long-term statistics."
readme = "README.md"
authors = [
    { name = "Nick Burns", email = "nick@burns.io" }
]
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.47",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
portlandwater-import = "portlandwater_import.__main__:main"

[build-system]
requires = ["uv_build>=0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
